<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Personal Portfolio — My developer portfolio for showcasing projects and technical skills."><title>Personal Portfolio — My developer portfolio for showcasing projects and technical skills.</title>
